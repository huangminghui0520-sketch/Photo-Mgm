name: Build APK

# 推送到 main 自动构建并发布预发布版；推送 v* 标签（如 v1.0.0）自动构建并发布正式版
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # 允许创建 tag 与发布 Release 所需的 contents 写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 项目国内镜像已写入 settings.gradle.kts（阿里云），Actions 环境直连亦可
      # 安装 Gradle 8.10.2（与 gradle-wrapper.properties 一致），绕过仓库内无 wrapper jar 的问题
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # 正式签名：若配置了 GitHub Secrets（KEYSTORE_BASE64 等）则注入签名；
      # 未配置时 build.gradle.kts 自动回退 debug 签名（可安装使用，非正式签名）
      # 注意：使用 printf 而非 heredoc，避免 YAML 缩进导致 EOF 不闭合
      - name: Configure release signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/photomgm-release.jks
            printf 'storeFile=keystore/photomgm-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
              "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
              "${{ secrets.KEYSTORE_KEY_PASSWORD }}" > keystore/keystore.properties
            echo "正式签名已注入（keystore.properties 已生成）"
          else
            echo "未配置 KEYSTORE_BASE64 → release 将回退 debug 签名（功能完整可安装）"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      # AGP 8.7.3 公共 API 不支持配置 APK 输出名，构建产物为 app-release.apk；
      # 上传前重命名为 Photo-Mgm-release.apk
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Photo-Mgm-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Mgm-release-apk
          path: dist/Photo-Mgm-release.apk
          if-no-files-found: error

      # ── 正式版发布：仅 v* 标签触发（如 v1.0.0）──
      - name: Publish GitHub Release (stable, tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Photo-Mgm ${{ github.ref_name }}
          body: |
            ## Photo-Mgm ${{ github.ref_name }}
            正式发布版安装包。
            - Commit：`${{ github.sha }}`
            - 说明：请确认已配置 KEYSTORE_BASE64 等 Secrets，否则为 debug 签名。
          files: dist/Photo-Mgm-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 自动构建版发布：仅 main 分支推送触发 ──
      - name: Publish GitHub Release (auto build)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: Photo-Mgm 自动构建 #${{ github.run_number }}
          body: |
            每次推送 main 自动生成的测试安装包。
            - 构建序号：#${{ github.run_number }}
            - Commit：`${{ github.sha }}`
            - 说明：此为自动构建（debug 签名），正式签名版请打 v* 标签发布。
          files: dist/Photo-Mgm-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
